[package]
name = "ci-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
axum = "=0.8.4"
clap = { version = "=4.5.48", features = ["derive"] }
libc = "=0.2.177"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
futures-util = "=0.3.31"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process", "io-util"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
reqwest = { version = "=0.12.24", features = ["json"] }

[dev-dependencies]

[[bin]]
name = "ci-simulator"
path = "src/main.rs"

[[bin]]
name = "fixture-target"
path = "src/bin/fixture_target.rs"

[[bin]]
name = "fault-runner"
path = "src/bin/fault_runner.rs"
