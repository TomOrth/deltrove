name: Build contract

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache-dependency-path: clients/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: clients/typescript/.nvmrc
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - run: npm --prefix clients/typescript ci
      - run: tools/contracts/check-generated.sh
      - run: tools/contracts/check-compatibility.sh
      - run: tools/contracts/smoke-clients.sh
