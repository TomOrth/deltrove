name: CI simulator

on:
  push:
    paths:
      - "experiments/ci-simulator/**"
      - "docs/foundation/ci-simulator.md"
      - ".github/workflows/ci-simulator.yml"
  pull_request:
    paths:
      - "experiments/ci-simulator/**"
      - "docs/foundation/ci-simulator.md"
      - ".github/workflows/ci-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/ci-simulator
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo build --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      - if: runner.os != 'Windows'
        run: cargo run --locked --bin fault-runner -- demo --target target/debug/fixture-target
